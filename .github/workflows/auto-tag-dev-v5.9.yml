name: auto-tag-dev-v5.9
run-name: Auto-Tag Prerelease (v5.9)
on:
  schedule:
    - cron: 0 5 * * 0,2-6
  workflow_dispatch: {}
jobs:
  pre-flight:
    name: Pre-Flight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.git.outputs.sha }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/v5.9
          repository: ${{ github.repository }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build
        id: build
        run: yarn build
      - name: Identify git SHA
        id: git
        run: echo sha=$(git rev-parse HEAD) >> $GITHUB_OUTPUT
  auto-tag:
    name: Auto-Tag Release
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          ref: ${{ needs.pre-flight.outputs.sha }}
          repository: ${{ github.repository }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Tag PreRelease
        id: tag_prerelease
        run: yarn tag-release --idempotent --no-sign --push --prerelease=dev --release-line=5.9
